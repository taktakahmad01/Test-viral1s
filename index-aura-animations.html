<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral1s Template Test</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0b0f;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title strong {
      display: block;
      font-size: 18px;
    }

    .title span {
      display: block;
      margin-top: 3px;
      color: #9ca3af;
      font-size: 12px;
    }

    .badge {
      padding: 7px 10px;
      border: 1px solid #2a2a34;
      border-radius: 999px;
      color: #c4b5fd;
      background: #16161d;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      gap: 16px;
    }

    .reel-frame {
      width: min(100%, 390px);
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.38);
    }

    .inner-media {
      position: absolute;
      inset: 50% 0 auto 0;
      width: 100%;
      aspect-ratio: 3 / 4;
      transform: translateY(-50%);
      overflow: hidden;
      background: #000;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #auraVideo {
      display: block;
      object-fit: cover;
      opacity: 1;
      transform: scale(1.01);
    }

    .photo-layer {
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(1.08);
      background:
        radial-gradient(circle at 30% 25%, rgba(118,92,255,.30), transparent 35%),
        radial-gradient(circle at 72% 70%, rgba(82,124,255,.22), transparent 38%),
        #101018;
    }

    .photo-layer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-placeholder {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 64%;
      aspect-ratio: 1;
      border: 2px dashed rgba(255,255,255,.34);
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      font-weight: 900;
      font-size: clamp(22px, 7vw, 42px);
      letter-spacing: .04em;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .player-controls {
      width: min(100%, 390px);
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #765cff, #527cff);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .progress {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #24242d;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #765cff, #527cff);
    }

    .time {
      min-width: 72px;
      text-align: right;
      color: #a7a7b2;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .panel {
      padding: 14px;
      border: 1px solid #272731;
      border-radius: 20px;
      background: #131319;
    }

    .panel h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .panel-copy {
      margin: 0 0 14px;
      color: #9999a5;
      font-size: 12px;
      line-height: 1.45;
    }

    .photo-inputs {
      display: grid;
      gap: 10px;
    }

    .photo-input {
      position: relative;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 9px 10px;
      overflow: hidden;
      border: 1px solid #2a2a34;
      border-radius: 15px;
      background: #191920;
      cursor: pointer;
    }

    .photo-input input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .thumb {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 11px;
      background: #24242d;
      color: #b7b7c2;
      font-size: 12px;
      font-weight: 900;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-copy strong {
      display: block;
      font-size: 13px;
    }

    .photo-copy span {
      display: block;
      margin-top: 3px;
      color: #8e8e99;
      font-size: 11px;
    }

    .replace {
      color: #a99aff;
      font-size: 11px;
      font-weight: 800;
    }

    .hint {
      width: min(100%, 390px);
      margin: 10px auto 0;
      text-align: center;
      color: #777784;
      font-size: 11px;
    }

    @media (min-width: 820px) {
      .app { padding: 24px; }

      .workspace {
        grid-template-columns: minmax(360px, 460px) minmax(320px, 1fr);
        align-items: center;
        gap: 28px;
      }

      .reel-frame,
      .player-controls,
      .hint {
        width: 100%;
      }

      .panel { padding: 20px; }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div class="title">
        <strong>Aura Photo Trend</strong>
        <span>Template 01 · 3 photos · 9:16</span>
      </div>

      <div class="badge">FREE · NO WATERMARK</div>
    </header>

    <section class="workspace">

      <div class="player-column">

        <div class="reel-frame">
          <div class="inner-media">

            <video
              id="auraVideo"
              class="layer"
              src="./template1-aura.mp4"
              muted
              playsinline
              preload="auto"
            ></video>

            <div class="layer photo-layer" id="photoLayer1">
              <img id="photoPreview1" alt="">
              <div class="photo-placeholder" id="placeholder1">PHOTO 1</div>
            </div>

            <div class="layer photo-layer" id="photoLayer2">
              <img id="photoPreview2" alt="">
              <div class="photo-placeholder" id="placeholder2">PHOTO 2</div>
            </div>

            <div class="layer photo-layer" id="photoLayer3">
              <img id="photoPreview3" alt="">
              <div class="photo-placeholder" id="placeholder3">PHOTO 3</div>
            </div>

          </div>
        </div>

        <div class="player-controls">
          <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-label="Play template"
          >
            ▶
          </button>

          <div class="progress">
            <div id="progressFill" class="progress-fill"></div>
          </div>

          <div class="time">
            <span id="currentTime">0:00</span>
            /
            <span id="totalTime">0:00</span>
          </div>
        </div>

        <p class="hint">
          Play works before uploading anything. Empty slots stay as PHOTO 1, PHOTO 2 and PHOTO 3.
        </p>

      </div>

      <aside class="panel">

        <h2>Replace photos</h2>

        <p class="panel-copy">
          Add any photos you want. You do not need to fill all 3 slots.
        </p>

        <div class="photo-inputs">

          <label class="photo-input">
            <input id="photoInput1" type="file" accept="image/*">

            <span class="thumb">
              <span id="thumbText1">1</span>
              <img id="thumbImage1" alt="">
            </span>

            <span class="photo-copy">
              <strong>Photo 1</strong>
              <span id="fileName1">Demo placeholder</span>
            </span>

            <span class="replace">Choose</span>
          </label>

          <label class="photo-input">
            <input id="photoInput2" type="file" accept="image/*">

            <span class="thumb">
              <span id="thumbText2">2</span>
              <img id="thumbImage2" alt="">
            </span>

            <span class="photo-copy">
              <strong>Photo 2</strong>
              <span id="fileName2">Demo placeholder</span>
            </span>

            <span class="replace">Choose</span>
          </label>

          <label class="photo-input">
            <input id="photoInput3" type="file" accept="image/*">

            <span class="thumb">
              <span id="thumbText3">3</span>
              <img id="thumbImage3" alt="">
            </span>

            <span class="photo-copy">
              <strong>Photo 3</strong>
              <span id="fileName3">Demo placeholder</span>
            </span>

            <span class="replace">Choose</span>
          </label>

        </div>

      </aside>

    </section>

    <audio
      id="templateMusic"
      src="./template1-music.mp3"
      preload="auto"
    ></audio>

  </main>

  <script>
    const auraVideo = document.getElementById("auraVideo");
    const music = document.getElementById("templateMusic");
    const playBtn = document.getElementById("playBtn");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const totalTimeEl = document.getElementById("totalTime");

    const photoLayers = [
      document.getElementById("photoLayer1"),
      document.getElementById("photoLayer2"),
      document.getElementById("photoLayer3")
    ];

    let playing = false;
    let animationFrame = null;
    let duration = 13.07;
    let activeScene = "";

    const AURA_SAFE_START = 2.0;

    function formatTime(seconds) {
      const safe = Number.isFinite(seconds)
        ? Math.max(0, seconds)
        : 0;

      return (
        Math.floor(safe / 60)
        + ":"
        + String(Math.floor(safe % 60)).padStart(2, "0")
      );
    }

    function setDuration() {
      if (
        Number.isFinite(music.duration)
        && music.duration > 0
      ) {
        duration = music.duration;
      }

      totalTimeEl.textContent = formatTime(duration);
    }

    music.addEventListener("loadedmetadata", setDuration);
    setDuration();

    const TRANSITION_SECONDS = 0.18;

    function clamp01(value) {
      return Math.min(Math.max(value, 0), 1);
    }

    function easeOutCubic(value) {
      const t = clamp01(value);
      return 1 - Math.pow(1 - t, 3);
    }

    function hidePhotos() {
      photoLayers.forEach(layer => {
        layer.style.opacity = "0";
        layer.style.filter = "blur(0px)";
        layer.style.transform = "scale(1) scaleY(1) translateY(0%)";
      });
    }

    function resetPhotoLayer(layer) {
      layer.style.opacity = "0";
      layer.style.filter = "blur(0px)";
      layer.style.transform = "scale(1) scaleY(1) translateY(0%)";
    }

    function hideAura() {
      auraVideo.style.opacity = "0";
    }

    function showAura() {
      hidePhotos();
      auraVideo.style.opacity = "1";
      auraVideo.style.filter = "blur(0px) brightness(1)";
      auraVideo.style.transform = "scale(1.01) scaleY(1) translateY(0%)";
    }

    function showBlack() {
      auraVideo.pause();
      hideAura();
      hidePhotos();
    }

    function prepareNextAura() {
      auraVideo.pause();
      hideAura();

      try {
        auraVideo.currentTime = AURA_SAFE_START;
      } catch (error) {}
    }

    function startPreparedAura() {
      auraVideo.play().catch(() => {});
    }

    function renderPhotoFromAura(index, elapsed) {
      const raw = clamp01(elapsed / TRANSITION_SECONDS);
      const eased = easeOutCubic(raw);
      const layer = photoLayers[index];

      photoLayers.forEach((item, i) => {
        if (i !== index) {
          resetPhotoLayer(item);
        }
      });

      /*
        Match the reference transition:
        Aura and the first photo briefly overlap.
        The photo enters stretched + blurred, then snaps clean.
      */
      auraVideo.style.opacity = String(1 - eased);
      auraVideo.style.filter =
        `blur(${(7 * eased).toFixed(2)}px) brightness(${(1 - 0.08 * eased).toFixed(3)})`;
      auraVideo.style.transform =
        `scale(${(1.01 + 0.035 * eased).toFixed(4)}) scaleY(${(1 + 0.10 * eased).toFixed(4)})`;

      layer.style.opacity = String(0.30 + 0.70 * eased);
      layer.style.filter =
        `blur(${(18 * (1 - eased)).toFixed(2)}px) brightness(${(0.92 + 0.08 * eased).toFixed(3)})`;
      layer.style.transform =
        `scale(${(1.13 - 0.13 * eased).toFixed(4)}) ` +
        `scaleY(${(1.30 - 0.30 * eased).toFixed(4)}) ` +
        `translateY(${(-4 * (1 - eased)).toFixed(2)}%)`;

      if (raw >= 1) {
        auraVideo.pause();
        auraVideo.style.opacity = "0";
        auraVideo.style.filter = "blur(0px) brightness(1)";
        layer.style.opacity = "1";
        layer.style.filter = "blur(0px) brightness(1)";
        layer.style.transform = "scale(1) scaleY(1) translateY(0%)";
      }
    }

    function renderPhotoFromPhoto(index, previousIndex, elapsed) {
      const raw = clamp01(elapsed / TRANSITION_SECONDS);
      const eased = easeOutCubic(raw);
      const incoming = photoLayers[index];
      const outgoing = photoLayers[previousIndex];

      auraVideo.style.opacity = "0";

      photoLayers.forEach((item, i) => {
        if (i !== index && i !== previousIndex) {
          resetPhotoLayer(item);
        }
      });

      /* Outgoing photo smears away. */
      outgoing.style.opacity = String(1 - eased);
      outgoing.style.filter =
        `blur(${(12 * eased).toFixed(2)}px) brightness(${(1 - 0.07 * eased).toFixed(3)})`;
      outgoing.style.transform =
        `scale(${(1 + 0.055 * eased).toFixed(4)}) ` +
        `scaleY(${(1 + 0.18 * eased).toFixed(4)}) ` +
        `translateY(${(3 * eased).toFixed(2)}%)`;

      /* Incoming photo arrives with the vertical blur seen in the reference. */
      incoming.style.opacity = String(0.34 + 0.66 * eased);
      incoming.style.filter =
        `blur(${(18 * (1 - eased)).toFixed(2)}px) brightness(${(0.92 + 0.08 * eased).toFixed(3)})`;
      incoming.style.transform =
        `scale(${(1.13 - 0.13 * eased).toFixed(4)}) ` +
        `scaleY(${(1.32 - 0.32 * eased).toFixed(4)}) ` +
        `translateY(${(-4 * (1 - eased)).toFixed(2)}%)`;

      if (raw >= 1) {
        resetPhotoLayer(outgoing);
        incoming.style.opacity = "1";
        incoming.style.filter = "blur(0px) brightness(1)";
        incoming.style.transform = "scale(1) scaleY(1) translateY(0%)";
      }
    }

    function renderAuraFromPhoto(previousIndex, elapsed) {
      const raw = clamp01(elapsed / TRANSITION_SECONDS);
      const eased = easeOutCubic(raw);
      const outgoing = photoLayers[previousIndex];

      photoLayers.forEach((item, i) => {
        if (i !== previousIndex) {
          resetPhotoLayer(item);
        }
      });

      /* Aura is already seeked to 2s, so there is no intro fade here. */
      auraVideo.style.opacity = String(0.35 + 0.65 * eased);
      auraVideo.style.filter =
        `blur(${(15 * (1 - eased)).toFixed(2)}px) brightness(${(0.94 + 0.06 * eased).toFixed(3)})`;
      auraVideo.style.transform =
        `scale(${(1.085 - 0.075 * eased).toFixed(4)}) ` +
        `scaleY(${(1.18 - 0.18 * eased).toFixed(4)}) ` +
        `translateY(${(-2.5 * (1 - eased)).toFixed(2)}%)`;

      outgoing.style.opacity = String(1 - eased);
      outgoing.style.filter =
        `blur(${(12 * eased).toFixed(2)}px) brightness(${(1 - 0.08 * eased).toFixed(3)})`;
      outgoing.style.transform =
        `scale(${(1 + 0.05 * eased).toFixed(4)}) ` +
        `scaleY(${(1 + 0.18 * eased).toFixed(4)})`;

      if (raw >= 1) {
        resetPhotoLayer(outgoing);
        auraVideo.style.opacity = "1";
        auraVideo.style.filter = "blur(0px) brightness(1)";
        auraVideo.style.transform = "scale(1.01) scaleY(1) translateY(0%)";
      }
    }

    function renderStablePhoto(index) {
      auraVideo.style.opacity = "0";
      photoLayers.forEach((layer, i) => {
        if (i === index) {
          layer.style.opacity = "1";
          layer.style.filter = "blur(0px) brightness(1)";
          layer.style.transform = "scale(1) scaleY(1) translateY(0%)";
        } else {
          resetPhotoLayer(layer);
        }
      });
    }

    function enterScene(scene) {
      if (scene === activeScene) {
        return;
      }

      activeScene = scene;

      /* Aura #1 keeps the original fade inside the source video. */
      if (scene === "aura1") {
        try {
          auraVideo.currentTime = 0;
        } catch (error) {}

        showAura();
        auraVideo.play().catch(() => {});
        return;
      }

      /*
        Prepare Aura #2/#3/#4 only after the Aura->Photo 1 transition
        has finished, so that the transition can still visually use Aura #1/#2/#3.
      */
      if (
        scene === "photo2a"
        || scene === "photo2b"
        || scene === "photo2c"
      ) {
        prepareNextAura();
        return;
      }

      if (
        scene === "aura2"
        || scene === "aura3"
        || scene === "aura4"
      ) {
        startPreparedAura();
        return;
      }

      if (scene === "black") {
        showBlack();
      }
    }

    function updateScene(time) {
      const videoProgress = Math.min(time / duration, 1);

      progressFill.style.width =
        (videoProgress * 100) + "%";

      currentTimeEl.textContent = formatTime(time);

      /*
        Same structure as the reference video:

        Aura #1 -> 3 photos -> Aura #2 -> 3 photos
        -> Aura #3 -> 3 photos -> Aura #4 -> end
      */

      if (time < 3.8) {
        enterScene("aura1");
        showAura();
        return;
      }

      if (time < 4.7) {
        enterScene("photo1a");
        const elapsed = time - 3.8;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromAura(0, elapsed);
        } else {
          renderStablePhoto(0);
        }
        return;
      }

      if (time < 5.3) {
        enterScene("photo2a");
        const elapsed = time - 4.7;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(1, 0, elapsed);
        } else {
          renderStablePhoto(1);
        }
        return;
      }

      if (time < 6.0) {
        enterScene("photo3a");
        const elapsed = time - 5.3;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(2, 1, elapsed);
        } else {
          renderStablePhoto(2);
        }
        return;
      }

      if (time < 6.6) {
        enterScene("aura2");
        const elapsed = time - 6.0;
        if (elapsed < TRANSITION_SECONDS) {
          renderAuraFromPhoto(2, elapsed);
        } else {
          showAura();
        }
        return;
      }

      if (time < 7.3) {
        enterScene("photo1b");
        const elapsed = time - 6.6;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromAura(0, elapsed);
        } else {
          renderStablePhoto(0);
        }
        return;
      }

      if (time < 7.9) {
        enterScene("photo2b");
        const elapsed = time - 7.3;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(1, 0, elapsed);
        } else {
          renderStablePhoto(1);
        }
        return;
      }

      if (time < 8.6) {
        enterScene("photo3b");
        const elapsed = time - 7.9;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(2, 1, elapsed);
        } else {
          renderStablePhoto(2);
        }
        return;
      }

      if (time < 9.2) {
        enterScene("aura3");
        const elapsed = time - 8.6;
        if (elapsed < TRANSITION_SECONDS) {
          renderAuraFromPhoto(2, elapsed);
        } else {
          showAura();
        }
        return;
      }

      if (time < 9.9) {
        enterScene("photo1c");
        const elapsed = time - 9.2;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromAura(0, elapsed);
        } else {
          renderStablePhoto(0);
        }
        return;
      }

      if (time < 10.5) {
        enterScene("photo2c");
        const elapsed = time - 9.9;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(1, 0, elapsed);
        } else {
          renderStablePhoto(1);
        }
        return;
      }

      if (time < 11.2) {
        enterScene("photo3c");
        const elapsed = time - 10.5;
        if (elapsed < TRANSITION_SECONDS) {
          renderPhotoFromPhoto(2, 1, elapsed);
        } else {
          renderStablePhoto(2);
        }
        return;
      }

      if (time < 11.8) {
        enterScene("aura4");
        const elapsed = time - 11.2;
        if (elapsed < TRANSITION_SECONDS) {
          renderAuraFromPhoto(2, elapsed);
        } else {
          showAura();
        }
        return;
      }

      enterScene("black");
      showBlack();
    }

    function resetPlayback() {
      music.pause();
      auraVideo.pause();

      music.currentTime = 0;

      try {
        auraVideo.currentTime = 0;
      } catch (error) {}

      activeScene = "";

      progressFill.style.width = "0%";
      currentTimeEl.textContent = "0:00";

      hidePhotos();
      showAura();
    }

    async function startPlayback() {
      resetPlayback();

      playing = true;
      playBtn.textContent = "❚❚";

      try {
        await music.play();
      } catch (error) {
        playing = false;
        playBtn.textContent = "▶";
        return;
      }

      updateScene(0);
      previewLoop();
    }

    function stopPlayback() {
      playing = false;
      playBtn.textContent = "▶";

      music.pause();
      auraVideo.pause();

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
    }

    function previewLoop() {
      if (!playing) {
        return;
      }

      const time = music.currentTime;

      updateScene(time);

      if (
        time >= duration - 0.04
        || music.ended
      ) {
        music.currentTime = 0;

        activeScene = "";

        try {
          auraVideo.currentTime = 0;
        } catch (error) {}

        music.play().catch(() => {});
      }

      animationFrame =
        requestAnimationFrame(previewLoop);
    }

    playBtn.addEventListener("click", () => {
      if (playing) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    for (let i = 1; i <= 3; i++) {
      const input =
        document.getElementById(
          "photoInput" + i
        );

      const preview =
        document.getElementById(
          "photoPreview" + i
        );

      const placeholder =
        document.getElementById(
          "placeholder" + i
        );

      const thumbImage =
        document.getElementById(
          "thumbImage" + i
        );

      const thumbText =
        document.getElementById(
          "thumbText" + i
        );

      const fileName =
        document.getElementById(
          "fileName" + i
        );

      input.addEventListener(
        "change",
        () => {
          const file =
            input.files
            && input.files[0];

          if (!file) {
            return;
          }

          const url =
            URL.createObjectURL(file);

          preview.src = url;
          preview.style.display = "block";

          placeholder.style.display = "none";

          thumbImage.src = url;
          thumbImage.style.display = "block";

          thumbText.style.display = "none";

          fileName.textContent = file.name;
        }
      );
    }

    hidePhotos();
    showAura();
  </script>
</body>
</html>
